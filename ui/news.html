<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Agent Chat</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fff7ed;
            --fg: #431407;
            --accent: #f97316;
            --accent-light: rgba(249, 115, 22, 0.2);
            --assistant-bg: rgba(249, 115, 22, 0.12);
            --user-bg: #dcfce7;
            --system-bg: #fee2e2;
        }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .chat-shell {
            width: min(900px, 100%);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
            box-sizing: border-box;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid #fed7aa;
            box-shadow: 0 8px 24px rgba(180, 83, 9, 0.18);
        }

        .top-nav .brand {
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            color: var(--fg);
        }

        .top-nav .nav-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-nav .nav-links a {
            text-decoration: none;
            color: #7c2d12;
            padding: 6px 14px;
            border-radius: 999px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .top-nav .nav-links a.active,
        .top-nav .nav-links a:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        header h1 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 600;
        }

        header p {
            margin: 0;
            color: #713f12;
        }

        .chat-panel {
            flex: 1 1 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(180, 83, 9, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-content {
            display: flex;
            flex: 1;
            padding: 24px;
            gap: 18px;
            background: #fff4e6;
        }

        .chat-messages {
            flex: 1 1 auto;
            min-height: 360px;
            overflow-y: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 78%;
            padding: 14px 16px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bg);
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--assistant-bg);
        }

        .message.system {
            align-self: center;
            background: var(--system-bg);
        }

        .message-header {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .article-list {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .article-card {
            display: flex;
            gap: 14px;
            padding: 18px;
            border-radius: 18px;
            border: 1px solid rgba(249, 115, 22, 0.24);
            background: linear-gradient(135deg, rgba(254, 243, 199, 0.35), rgba(253, 230, 138, 0.25));
            box-shadow: 0 8px 18px rgba(180, 83, 9, 0.12);
        }

        .article-card:first-child {
            border-color: rgba(249, 115, 22, 0.45);
            box-shadow: 0 12px 28px rgba(180, 83, 9, 0.18);
        }

        .article-card:first-child .article-rank {
            background: rgba(249, 115, 22, 0.3);
            color: #7c2d12;
        }

        .article-rank {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.15);
            color: #9a3412;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .article-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .article-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #7c2d12;
        }

        .article-summary {
            margin: 0;
            color: #9a3412;
            line-height: 1.45;
        }

        .article-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .article-source {
            background: rgba(249, 115, 22, 0.18);
            color: #9a3412;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .article-link {
            appearance: none;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 16px rgba(249, 115, 22, 0.25);
        }

        .article-link:hover {
            background: #fb923c;
        }

        .article-link span {
            font-size: 1rem;
        }

        .tool-output {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #fed7aa;
        }

        .tool-output summary {
            cursor: pointer;
            font-weight: 500;
        }

        .status-bar {
            padding: 10px 16px;
            background: #fff;
            border-top: 1px solid #fed7aa;
            font-size: 0.95rem;
            color: #9a3412;
            min-height: 24px;
        }

        .composer {
            padding: 16px;
            background: #fff;
            border-top: 1px solid #fed7aa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .composer textarea {
            resize: none;
            min-height: 80px;
            border: 1px solid #fed7aa;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .composer textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
        }

        .composer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            appearance: none;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(249, 115, 22, 0.28);
        }

        .btn-secondary {
            background: #fee2e2;
            color: #7c2d12;
        }

        .sample-prompts {
            width: 220px;
            flex: 0 0 220px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #fed7aa;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: flex-start;
            box-shadow: inset 0 0 0 1px rgba(249, 115, 22, 0.08);
            max-height: 100%;
            overflow-y: auto;
        }

        .sample-prompts h3 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: #c2410c;
        }

        .sample-prompts button {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #c2410c;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .sample-prompts button:hover {
            background: #f97316;
            color: #fff;
            box-shadow: 0 6px 14px rgba(249, 115, 22, 0.22);
        }

        .sample-prompts button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
        }

        @media (max-width: 640px) {
            .chat-shell {
                padding: 16px;
            }

            .chat-content {
                flex-direction: column;
            }

            .sample-prompts {
                width: 100%;
                flex: none;
            }

            .message {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-shell">
        <nav class="top-nav">
            <a href="news.html" class="brand">📰 News Agent</a>
            <div class="nav-links">
                <a href="index.html">Orchestrator</a>
                <a href="weather.html">Weather</a>
                <a href="news.html" class="active">News</a>
                <a href="communications.html">Agent Communications</a>
            </div>
        </nav>

        <header>
            <h1>News Agent Chat</h1>
            <p>Request the latest headlines in plain English. The agent extracts your topic and retrieves top articles via MCP.</p>
        </header>

        <div class="chat-panel">
            <div class="chat-content">
                <div id="messages" class="chat-messages"></div>
                <aside class="sample-prompts" id="samplePrompts">
                    <h3>Sample prompts</h3>
                </aside>
            </div>
            <div id="status" class="status-bar"></div>
            <form id="chatForm" class="composer">
                <textarea id="chatInput" placeholder="e.g. Give me the latest AI ethics stories" autocomplete="off"></textarea>
                <div class="composer-actions">
                    <button type="button" id="clearBtn" class="btn-secondary">Clear conversation</button>
                    <button type="submit" class="btn-primary">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'a2a-agentcore-transcripts';
        const messagesEl = document.getElementById('messages');
        const formEl = document.getElementById('chatForm');
        const inputEl = document.getElementById('chatInput');
        const statusEl = document.getElementById('status');
        const clearBtn = document.getElementById('clearBtn');
        const promptsEl = document.getElementById('samplePrompts');

        const history = [];
        const SAMPLE_PROMPTS = [
            'Show me the latest fintech headlines in the UK.',
            'Summarize AI safety news from the past day.',
            'What are the top stories about renewable energy this week?',
            'Give me climate change news focused on Europe.',
        ];

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function setStatus(text) {
            statusEl.textContent = text || '';
        }

        function createMessage(role, content) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${role}`;
            if (role !== 'system') {
                const header = document.createElement('div');
                header.className = 'message-header';
                header.textContent = role === 'user' ? 'You' : 'News Agent';
                wrapper.appendChild(header);
            }
            const body = document.createElement('div');
            body.className = 'message-body';
            body.textContent = content;
            wrapper.appendChild(body);
            return wrapper;
        }

        function appendMessage(role, content, options = {}) {
            const block = createMessage(role, content);

            if (options.articles && options.articles.length) {
                const list = document.createElement('div');
                list.className = 'article-list';
                options.articles.forEach((article, index) => {
                    const card = document.createElement('div');
                    card.className = 'article-card';

                    const rank = document.createElement('div');
                    rank.className = 'article-rank';
                    rank.textContent = index + 1;

                    const contentWrap = document.createElement('div');
                    contentWrap.className = 'article-content';

                    const title = document.createElement('h4');
                    title.className = 'article-title';
                    title.textContent = article.title || 'Untitled article';

                    const description = document.createElement('p');
                    description.className = 'article-summary';
                    description.textContent = article.description || 'No summary provided.';

                    const footer = document.createElement('div');
                    footer.className = 'article-footer';

                    if (article.url) {
                        try {
                            const domain = new URL(article.url).hostname.replace(/^www\./i, '');
                            const source = document.createElement('span');
                            source.className = 'article-source';
                            source.textContent = domain || 'source';
                            footer.appendChild(source);
                        } catch (error) {
                            // ignore malformed URLs
                        }

                        const link = document.createElement('a');
                        link.className = 'article-link';
                        link.href = article.url;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.innerHTML = 'Read article<span aria-hidden="true"> →</span>';
                        footer.appendChild(link);
                    }

                    contentWrap.appendChild(title);
                    contentWrap.appendChild(description);
                    if (footer.childNodes.length) {
                        contentWrap.appendChild(footer);
                    }

                    card.appendChild(rank);
                    card.appendChild(contentWrap);
                    list.appendChild(card);
                });
                block.appendChild(list);
            }

            if (options.toolOutputs && options.toolOutputs.length) {
                const container = document.createElement('div');
                container.className = 'tool-output';
                const summary = document.createElement('details');
                const title = document.createElement('summary');
                title.textContent = 'Tool outputs';
                summary.appendChild(title);

                options.toolOutputs.forEach((tool, index) => {
                    const label = document.createElement('div');
                    label.style.marginTop = '10px';
                    label.style.fontWeight = '600';
                    label.textContent = `Result ${index + 1}`;

                    const pre = document.createElement('pre');
                    pre.style.background = '#fff8eb';
                    pre.style.padding = '8px';
                    pre.style.borderRadius = '10px';
                    pre.style.overflowX = 'auto';
                    pre.textContent = JSON.stringify(tool, null, 2);

                    summary.appendChild(label);
                    summary.appendChild(pre);
                });

                container.appendChild(summary);
                block.appendChild(container);
            }

            messagesEl.appendChild(block);
            scrollToBottom();
        }

        function readTranscripts() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (error) {
                console.warn('Unable to read transcripts', error);
                return [];
            }
        }

        function saveTranscript(entry) {
            const transcripts = readTranscripts();
            transcripts.push(entry);
            const trimmed = transcripts.slice(-25);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
        }

        async function extractNewsTopic(query) {
            const response = await fetch('http://localhost:8002/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query }),
            });
            const payload = await response.json();
            if (!response.ok || payload.error || payload.detail) {
                throw new Error(payload.detail || payload.error || 'Unable to extract news topic.');
            }
            if (!payload.query) {
                throw new Error('Topic extractor returned an empty query.');
            }
            return payload;
        }

        async function fetchNewsArticles(params) {
            const response = await fetch('http://localhost:8002/news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params),
            });
            const payload = await response.json();
            if (!response.ok || payload.error || payload.detail) {
                throw new Error(payload.detail || payload.error || 'News provider unavailable.');
            }
            return payload;
        }

        formEl.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = inputEl.value.trim();
            if (!text) {
                return;
            }

            inputEl.value = '';
            appendMessage('user', text);
            history.push({ role: 'user', content: text });

            try {
                setStatus('🧠 Extracting topic...');
                const extractData = await extractNewsTopic(text);

                setStatus(`📰 Fetching headlines for "${extractData.query}"`);
                const newsData = await fetchNewsArticles(extractData);

                const articles = Array.isArray(newsData.articles) ? newsData.articles : [];
                const headlineCount = Math.min(articles.length, 3);
                const summary = headlineCount
                    ? `Top ${headlineCount} headline(s): ${articles.slice(0, headlineCount).map((article) => article.title || 'Untitled article').join('; ')}`
                    : 'No articles returned for this topic.';

                appendMessage('assistant', summary, {
                    articles,
                    toolOutputs: [
                        { agent_id: 'news-agent', capability: 'extract', payload: extractData },
                        { agent_id: 'news-agent', capability: 'get_news', payload: newsData },
                    ],
                });
                history.push({ role: 'assistant', content: summary });

                saveTranscript({
                    timestamp: new Date().toISOString(),
                    source: 'news',
                    query: text,
                    response: summary,
                    invokedAgents: ['news-agent'],
                    toolOutputs: [
                        { agent_id: 'news-agent', capability: 'extract', payload: extractData },
                        { agent_id: 'news-agent', capability: 'get_news', payload: newsData },
                    ],
                    results: newsData,
                });

                setStatus('✅ News retrieved');
            } catch (error) {
                appendMessage('system', `⚠️ ${error.message}`);
                setStatus('⚠️ News request failed');
            } finally {
                setTimeout(() => setStatus(''), 2500);
            }
        });

        clearBtn.addEventListener('click', () => {
            history.splice(0, history.length);
            messagesEl.innerHTML = '';
            appendMessage('system', 'Conversation cleared.');
            inputEl.focus();
        });

        appendMessage('assistant', 'Hi! Ask me for the latest headlines on any topic.');
        inputEl.focus();

        SAMPLE_PROMPTS.forEach((prompt) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = prompt;
            button.addEventListener('click', () => {
                inputEl.value = prompt;
                inputEl.focus();
            });
            promptsEl.appendChild(button);
        });
    </script>
</body>
</html>
