<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Agent Chat</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ecf4ff;
            --fg: #0f172a;
            --accent: #0ea5e9;
            --accent-light: rgba(14, 165, 233, 0.18);
            --assistant-bg: rgba(14, 165, 233, 0.12);
            --user-bg: #dcfce7;
            --system-bg: #fee2e2;
        }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .chat-shell {
            width: min(900px, 100%);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
            box-sizing: border-box;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid #e0f2fe;
            box-shadow: 0 8px 24px rgba(14, 116, 144, 0.15);
        }

        .top-nav .brand {
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            color: var(--fg);
        }

        .top-nav .nav-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-nav .nav-links a {
            text-decoration: none;
            color: #1e293b;
            padding: 6px 14px;
            border-radius: 999px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .top-nav .nav-links a.active,
        .top-nav .nav-links a:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        header h1 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 600;
        }

        header p {
            margin: 0;
            color: #475569;
        }

        .chat-panel {
            flex: 1 1 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(14, 116, 144, 0.16);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-content {
            display: flex;
            flex: 1;
            padding: 24px;
            gap: 18px;
            background: #f1f5f9;
        }

        .chat-messages {
            flex: 1 1 auto;
            min-height: 340px;
            overflow-y: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 78%;
            padding: 14px 16px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bg);
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--assistant-bg);
        }

        .message.system {
            align-self: center;
            background: var(--system-bg);
        }

        .message-header {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .message-body {
            margin: 0;
        }

        .details-list {
            margin-top: 10px;
            border-top: 1px dashed rgba(148, 163, 184, 0.6);
            padding-top: 10px;
            font-size: 0.95rem;
        }

        .details-list dt {
            font-weight: 600;
        }

        .details-list dd {
            margin: 0 0 8px 0;
        }

        .tool-output {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #e2e8f0;
        }

        .tool-output summary {
            cursor: pointer;
            font-weight: 500;
        }

        .status-bar {
            padding: 10px 16px;
            background: #fff;
            border-top: 1px solid #e2e8f0;
            font-size: 0.95rem;
            color: #0369a1;
            min-height: 24px;
        }

        .composer {
            padding: 16px;
            background: #fff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .composer textarea {
            resize: none;
            min-height: 80px;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .composer textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        .composer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            appearance: none;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(14, 165, 233, 0.28);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }

        .sample-prompts {
            width: 200px;
            flex: 0 0 200px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #bae6fd;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: flex-start;
            box-shadow: inset 0 0 0 1px rgba(14, 165, 233, 0.08);
            max-height: 100%;
            overflow-y: auto;
        }

        .sample-prompts h3 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0369a1;
        }

        .sample-prompts button {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            color: #0369a1;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .sample-prompts button:hover {
            background: #0ea5e9;
            color: #fff;
            box-shadow: 0 6px 14px rgba(14, 165, 233, 0.24);
        }

        .sample-prompts button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25);
        }

        .weather-card {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.12), rgba(56, 189, 248, 0.08));
            border: 1px solid rgba(14, 165, 233, 0.25);
            border-radius: 16px;
            padding: 18px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .weather-card header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .weather-location {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
        }

        .weather-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            color: #0369a1;
            font-weight: 500;
        }

        .weather-temp {
            font-size: 2.4rem;
            font-weight: 700;
            color: #0ea5e9;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .weather-temp span {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .weather-desc {
            font-size: 1rem;
            color: #0369a1;
            font-weight: 500;
            text-transform: capitalize;
        }

        .weather-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.95rem;
            color: #0f172a;
        }

        .weather-stats span {
            background: rgba(14, 165, 233, 0.12);
            border-radius: 999px;
            padding: 6px 12px;
        }

        @media (max-width: 640px) {
            .chat-shell {
                padding: 16px;
            }

            .chat-content {
                flex-direction: column;
            }

            .sample-prompts {
                width: 100%;
                flex: none;
            }

            .message {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-shell">
        <nav class="top-nav">
            <a href="weather.html" class="brand">🌤️ Weather Agent</a>
            <div class="nav-links">
                <a href="index.html">Orchestrator</a>
                <a href="weather.html" class="active">Weather</a>
                <a href="news.html">News</a>
                <a href="communications.html">Agent Communications</a>
            </div>
        </nav>

        <header>
            <h1>Weather Agent Chat</h1>
            <p>Ask for the current conditions in natural language. We will extract the location and call the weather MCP tool for you.</p>
        </header>

        <div class="chat-panel">
            <div class="chat-content">
                <div id="messages" class="chat-messages"></div>
                <aside class="sample-prompts" id="samplePrompts">
                    <h3>Sample prompts</h3>
                </aside>
            </div>
            <div id="status" class="status-bar"></div>
            <form id="chatForm" class="composer">
                <textarea id="chatInput" placeholder="e.g. What's the weather like in Paris?" autocomplete="off"></textarea>
                <div class="composer-actions">
                    <button type="button" id="clearBtn" class="btn-secondary">Clear conversation</button>
                    <button type="submit" class="btn-primary">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'a2a-agentcore-transcripts';
        const messagesEl = document.getElementById('messages');
        const formEl = document.getElementById('chatForm');
        const inputEl = document.getElementById('chatInput');
        const statusEl = document.getElementById('status');
        const clearBtn = document.getElementById('clearBtn');
        const promptsEl = document.getElementById('samplePrompts');

        const history = [];
        const SAMPLE_PROMPTS = [
            "What's the weather like in Paris, France?",
            "Do I need an umbrella in Seattle today?",
            'Give me the forecast for Sydney tomorrow morning.',
            'Show me weather conditions in Mumbai, IN.',
        ];

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function setStatus(text) {
            statusEl.textContent = text || '';
        }

        const WEATHER_ICON_RULES = [
            { pattern: /thunder|storm/i, emoji: '⛈️' },
            { pattern: /rain|shower|drizzle/i, emoji: '🌧️' },
            { pattern: /snow|sleet|blizzard/i, emoji: '❄️' },
            { pattern: /fog|mist|haze/i, emoji: '🌫️' },
            { pattern: /cloud/i, emoji: '☁️' },
            { pattern: /wind/i, emoji: '🌬️' },
            { pattern: /sun|clear|hot/i, emoji: '☀️' },
        ];

        function getWeatherEmoji(description = '') {
            for (const rule of WEATHER_ICON_RULES) {
                if (rule.pattern.test(description)) {
                    return rule.emoji;
                }
            }
            return '🌡️';
        }

        function createWeatherStatChip(label, value) {
            const chip = document.createElement('span');
            chip.innerHTML = `<strong>${label}:</strong> ${value}`;
            return chip;
        }

        function createWeatherCard(data) {
            const card = document.createElement('div');
            card.className = 'weather-card';

            const header = document.createElement('header');
            const location = document.createElement('div');
            location.className = 'weather-location';
            location.textContent = data.city || 'Unknown location';

            const meta = document.createElement('div');
            meta.className = 'weather-meta';
            const emoji = document.createElement('span');
            emoji.textContent = getWeatherEmoji(data.description);
            const desc = document.createElement('span');
            desc.className = 'weather-desc';
            desc.textContent = data.description || 'No description';

            meta.appendChild(emoji);
            meta.appendChild(desc);
            header.appendChild(location);
            header.appendChild(meta);

            const temperature = document.createElement('div');
            temperature.className = 'weather-temp';
            let tempValue = '—';
            if (typeof data.temperature === 'number' && Number.isFinite(data.temperature)) {
                tempValue = Math.round(data.temperature);
            } else if (typeof data.temperature === 'string') {
                const parsed = parseFloat(data.temperature);
                tempValue = Number.isNaN(parsed) ? data.temperature : Math.round(parsed);
            }
            temperature.innerHTML = `${tempValue}<span>°C</span>`;

            const stats = document.createElement('div');
            stats.className = 'weather-stats';
            if (data.humidity !== undefined) {
                stats.appendChild(createWeatherStatChip('Humidity', `${data.humidity}%`));
            }
            if (data.feels_like !== undefined) {
                const feelValue =
                    typeof data.feels_like === 'number'
                        ? Math.round(data.feels_like)
                        : data.feels_like;
                stats.appendChild(createWeatherStatChip('Feels like', `${feelValue}°C`));
            }
            if (data.wind_speed !== undefined) {
                stats.appendChild(createWeatherStatChip('Wind', `${data.wind_speed} m/s`));
            }

            card.appendChild(header);
            card.appendChild(temperature);
            if (stats.childNodes.length) {
                card.appendChild(stats);
            }
            return card;
        }

        function createMessage(role, content) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${role}`;
            if (role !== 'system') {
                const header = document.createElement('div');
                header.className = 'message-header';
                header.textContent = role === 'user' ? 'You' : 'Weather Agent';
                wrapper.appendChild(header);
            }
            const body = document.createElement('div');
            body.className = 'message-body';
            body.textContent = content;
            wrapper.appendChild(body);
            return wrapper;
        }

        function appendMessage(role, content, options = {}) {
            const block = createMessage(role, content);

            if (options.weatherData) {
                block.appendChild(createWeatherCard(options.weatherData));
            }

            if (options.toolOutputs && options.toolOutputs.length) {
                const container = document.createElement('div');
                container.className = 'tool-output';
                const summary = document.createElement('details');
                const title = document.createElement('summary');
                title.textContent = 'Tool outputs';
                summary.appendChild(title);

                options.toolOutputs.forEach((tool, index) => {
                    const label = document.createElement('div');
                    label.style.marginTop = '10px';
                    label.style.fontWeight = '600';
                    label.textContent = `Result ${index + 1}`;

                    const pre = document.createElement('pre');
                    pre.style.background = '#f8fafc';
                    pre.style.padding = '8px';
                    pre.style.borderRadius = '10px';
                    pre.style.overflowX = 'auto';
                    pre.textContent = JSON.stringify(tool, null, 2);

                    summary.appendChild(label);
                    summary.appendChild(pre);
                });

                container.appendChild(summary);
                block.appendChild(container);
            }

            messagesEl.appendChild(block);
            scrollToBottom();
        }

        function readTranscripts() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (error) {
                console.warn('Unable to read transcripts', error);
                return [];
            }
        }

        function saveTranscript(entry) {
            const transcripts = readTranscripts();
            transcripts.push(entry);
            const trimmed = transcripts.slice(-25);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
        }

        async function extractWeatherParams(query) {
            const response = await fetch('http://localhost:8001/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query }),
            });
            const payload = await response.json();
            if (!response.ok || payload.error || payload.detail) {
                throw new Error(payload.detail || payload.error || 'Unable to extract weather parameters.');
            }
            if (!payload.city || !payload.country_code) {
                throw new Error('Missing city or country code from extractor.');
            }
            return payload;
        }

        async function fetchWeatherData(params) {
            const response = await fetch('http://localhost:8001/weather', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params),
            });
            const payload = await response.json();
            if (!response.ok || payload.error || payload.detail) {
                throw new Error(payload.detail || payload.error || 'Weather provider unavailable.');
            }
            return payload;
        }

        formEl.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = inputEl.value.trim();
            if (!text) {
                return;
            }

            inputEl.value = '';
            appendMessage('user', text);
            history.push({ role: 'user', content: text });

            try {
                setStatus('🔍 Extracting location...');
                const extractData = await extractWeatherParams(text);

                setStatus(`⛅ Fetching weather for ${extractData.city}, ${extractData.country_code}`);
                const weatherData = await fetchWeatherData(extractData);

                const roundedTemp =
                    typeof weatherData.temperature === 'number'
                        ? Math.round(weatherData.temperature)
                        : weatherData.temperature;
                const summary = `Weather in ${weatherData.city}: ${roundedTemp}°C, ${weatherData.description}. Humidity ${weatherData.humidity}%.`;

                appendMessage('assistant', summary, {
                    weatherData,
                    toolOutputs: [
                        { agent_id: 'weather-agent', capability: 'extract', payload: extractData },
                        { agent_id: 'weather-agent', capability: 'get_weather', payload: weatherData },
                    ],
                });
                history.push({ role: 'assistant', content: summary });

                saveTranscript({
                    timestamp: new Date().toISOString(),
                    source: 'weather',
                    query: text,
                    response: summary,
                    invokedAgents: ['weather-agent'],
                    toolOutputs: [
                        { agent_id: 'weather-agent', capability: 'extract', payload: extractData },
                        { agent_id: 'weather-agent', capability: 'get_weather', payload: weatherData },
                    ],
                    results: weatherData,
                });

                setStatus('✅ Weather retrieved');
            } catch (error) {
                appendMessage('system', `⚠️ ${error.message}`);
                setStatus('⚠️ Weather request failed');
            } finally {
                setTimeout(() => setStatus(''), 2500);
            }
        });

        clearBtn.addEventListener('click', () => {
            history.splice(0, history.length);
            messagesEl.innerHTML = '';
            appendMessage('system', 'Conversation cleared.');
            inputEl.focus();
        });

        appendMessage('assistant', 'Hi! Ask about the weather anywhere in the world.');
        inputEl.focus();

        SAMPLE_PROMPTS.forEach((prompt) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = prompt;
            button.addEventListener('click', () => {
                inputEl.value = prompt;
                inputEl.focus();
            });
            promptsEl.appendChild(button);
        });
    </script>
</body>
</html>
